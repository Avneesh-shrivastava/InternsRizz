
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recruiter Signup | Jobs 2 Swipe</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #080b18;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 15px;
        }

        .signup-container {
            width: 100%;
            max-width: 480px;
            background: #11162a;
            padding: 35px;
            border: 1px solid #252d48;
            border-radius: 18px;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.3);
        }

        .logo {
            text-align: center;
            font-size: 27px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .logo span {
            background: linear-gradient(90deg, #8b5cf6, #3b82f6);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .icon {
            width: 55px;
            height: 55px;
            background: rgba(139, 92, 246, 0.15);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 25px;
            margin: 0 auto 15px;
        }

        h2 {
            text-align: center;
            font-size: 25px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #a7aec5;
            font-size: 14px;
            margin-bottom: 28px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 17px;
        }

        label {
            display: block;
            font-size: 14px;
            margin-bottom: 8px;
            color: #dce1f1;
        }

        input {
            width: 100%;
            padding: 13px;
            background: #080b18;
            border: 1px solid #303954;
            border-radius: 9px;
            outline: none;
            color: white;
            font-size: 14px;
        }

        input:focus {
            border-color: #8b5cf6;
        }

        input::placeholder {
            color: #727b96;
        }

        .terms {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin: 20px 0;
            color: #a7aec5;
            font-size: 13px;
            line-height: 1.5;
        }

        .terms input {
            width: 16px;
            height: 16px;
            margin-top: 2px;
            accent-color: #8b5cf6;
        }

        .terms a {
            color: #a78bfa;
            text-decoration: none;
        }

        .signup-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: linear-gradient(90deg, #8b5cf6, #3b82f6);
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .signup-btn:hover {
            opacity: 0.88;
            transform: translateY(-2px);
        }

        .login {
            text-align: center;
            margin-top: 22px;
            color: #a7aec5;
            font-size: 14px;
        }

        .login a {
            color: #a78bfa;
            text-decoration: none;
            font-weight: bold;
        }

        .divider {
            border-top: 1px solid #252d48;
            margin: 22px 0;
        }

        .candidate-link {
            text-align: center;
            color: #a7aec5;
            font-size: 13px;
        }

        .candidate-link a {
            color: white;
            text-decoration: none;
        }

        @media (max-width: 480px) {
            .signup-container {
                padding: 28px 22px;
            }
        }
    </style>
</head>

<body>

    <div class="signup-container">

        <div class="logo">Jobs <span>2 Swipe</span></div>

        <div class="icon">💼</div>

        <h2>Create Recruiter Account</h2>

        <p class="subtitle">
            Join Jobs 2 Swipe and connect with talented candidates.
        </p>

        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label for="name">Full Name</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">Work Email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="you@company.com"
                    required
                >
            </div>

            <div class="form-group">
                <label for="company">Company Name</label>
                <input
                    type="text"
                    id="company"
                    name="company"
                    placeholder="Enter your company name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="designation">Job Title / Designation</label>
                <input
                    type="text"
                    id="designation"
                    name="designation"
                    placeholder="e.g. HR Manager, Talent Acquisition"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    minlength="8"
                    required
                >
            </div>

            <div class="form-group">
                <label for="confirm_password">Confirm Password</label>
                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="Re-enter your password"
                    minlength="8"
                    required
                >
            </div>

            <div class="terms">
                <input type="checkbox" id="terms" name="terms" required>

                <label for="terms">
                    I agree to the <a href="">Terms & Conditions</a>
                    and <a href="">Privacy Policy</a>.
                </label>
            </div>

            <button type="submit" class="signup-btn">
                Create Recruiter Account →
            </button>

        </form>

        <p class="login">
            Already have an account?
            <a href="">Login</a>
        </p>

        <div class="divider"></div>

        <p class="candidate-link">
            Looking for a job?
            <a href="">Create Candidate Account</a>
        </p>

    </div>

</body>
</html>
